<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>No Man's Sky Alien Language Translator · LINGUA DECODER</title>
  <meta name="description" content="Translate No Man's Sky alien languages to English. Paste Gek, Korvax, Vy'keen, Autophage or Atlas text — the language is auto-detected. Free, in-browser, no sign-up.">
  <link rel="canonical" href="https://teegly.github.io/nms-language-translator/">
  <meta name="theme-color" content="#030a06">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="LINGUA DECODER">
  <meta property="og:title" content="No Man's Sky Alien Language Translator">
  <meta property="og:description" content="Paste Gek, Korvax, Vy'keen, Autophage or Atlas text and translate it to English. Free, in-browser, no sign-up.">
  <meta property="og:url" content="https://teegly.github.io/nms-language-translator/">
  <meta property="og:image" content="https://teegly.github.io/nms-language-translator/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="LINGUA DECODER — No Man's Sky language translator, CRT terminal interface">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="No Man's Sky Alien Language Translator">
  <meta name="twitter:description" content="Paste Gek, Korvax, Vy'keen, Autophage or Atlas text and translate it to English. Free, in-browser.">
  <meta name="twitter:image" content="https://teegly.github.io/nms-language-translator/og-image.png">

  <!-- Icons -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=12">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "LINGUA DECODER — No Man's Sky Language Translator",
    "url": "https://teegly.github.io/nms-language-translator/",
    "description": "Translate No Man's Sky alien languages (Gek, Korvax, Vy'keen, Autophage, Atlas) to English, with automatic language detection.",
    "applicationCategory": "UtilityApplication",
    "operatingSystem": "Any (web browser)",
    "browserRequirements": "Requires JavaScript",
    "isAccessibleForFree": true,
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
  }
  </script>
</head>
<body>
  <main class="wrap">
    <div class="topbar">
      <span class="status">V11 · SIGNAL ONLINE <span class="blink" aria-hidden="true">▮</span></span>
    </div>
    <section class="crt" id="crt">
      <div class="crt-content">
        <header class="hdr">
          <div class="brand">
            <h1 class="title">LINGUA <span class="title-dim">DECODER</span></h1>
            <p class="tagline">No Man's Sky Translator</p>
          </div>
        </header>

        <label class="label" for="input"><span aria-hidden="true">◢</span> INPUT SIGNAL</label>
        <div class="ta-wrap">
          <textarea id="input" placeholder="> enter alien language…"
                    autocomplete="off" spellcheck="false"></textarea>
        </div>

        <div class="upload soon-state" title="Not available yet" aria-disabled="true">
          <span class="upload-glyph" aria-hidden="true">▲</span>
          <span>IMAGE → TEXT (OCR)</span>
          <span class="soon-badge">COMING SOON</span>
        </div>

        <div class="label" id="lang-label"><span aria-hidden="true">◢</span> SOURCE LANGUAGE</div>
        <div class="chips" id="chips" role="group" aria-labelledby="lang-label">
          <button class="chip" type="button" data-lang="auto" aria-pressed="true">AUTO</button>
          <button class="chip" type="button" data-lang="Gek" aria-pressed="false">GEK</button>
          <button class="chip" type="button" data-lang="Korvax" aria-pressed="false">KORVAX</button>
          <button class="chip" type="button" data-lang="Vy'keen" aria-pressed="false">VY'KEEN</button>
          <button class="chip" type="button" data-lang="Autophage" aria-pressed="false">AUTOPHAGE</button>
          <button class="chip" type="button" data-lang="Atlas" aria-pressed="false">ATLAS</button>
        </div>

        <div class="readout" role="status" aria-live="polite">
          <span class="readout-label"><span id="readout-word">STATUS</span> <span aria-hidden="true">▸</span></span>
          <span class="readout-value" id="readout-value">AWAITING INPUT</span>
          <div class="meter" id="meter" aria-hidden="true"></div>
          <span class="tokens" id="tokens"></span>
        </div>

        <div class="label" id="output-label"><span aria-hidden="true">◢</span> TRANSLATED OUTPUT</div>
        <div class="output" id="output" aria-live="polite" aria-labelledby="output-label"></div>

        <footer class="foot" id="foot">INITIALISING DICTIONARY…</footer>
      </div>

      <div class="crt-scanlines" aria-hidden="true"></div>
      <div class="crt-vignette" aria-hidden="true"></div>
      <div class="crt-sweep" aria-hidden="true"></div>
    </section>

    <footer class="page-footer">
      Unofficial fan project.<br>
      Not affiliated with or endorsed by Hello Games.<br>
      No Man's Sky is a trademark of Hello Games.
    </footer>
  </main>

  <script src="engine.js?v=2"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
